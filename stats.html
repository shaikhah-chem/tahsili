<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>إحصائية شهادات التميّز — الفصول الأخرى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,system-ui,sans-serif;background:#F4F8F9;color:#16303B;margin:0;padding:20px}
.box{max-width:820px;margin:0 auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px #0001}
h1{font-size:24px;margin:0 0 4px;color:#0B4F6C}
.sub{color:#5a7480;margin:0 0 16px;font-size:15px}
input{font:inherit;padding:9px 12px;border:1.5px solid #c9d8de;border-radius:9px;width:100%;box-sizing:border-box;margin:5px 0}
button{font:inherit;font-weight:700;padding:9px 18px;border:0;border-radius:9px;background:#0B4F6C;color:#fff;cursor:pointer}
button.ghost{background:#e6eef1;color:#0B4F6C}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.stat{flex:1;min-width:140px;background:#EAF6F5;border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:26px;color:#0B4F6C}
table{width:100%;border-collapse:collapse;font-size:15.5px}
th,td{border:1px solid #000;padding:7px 9px;text-align:right;vertical-align:top}
th{background:#EAF2F5}
td.n{text-align:center;font-weight:800;font-size:18px}
small{color:#5a7480}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.err{color:#b3261e}
@media print{body{background:#fff;padding:0}.box{box-shadow:none}.tools,#out{display:none}}
</style>
</head>
<body>
<div class="box">
  <h1>إحصائية شهادات التميّز — طالبات الفصول الأخرى</h1>
  <p class="sub">مبادرة «تحدّي التحصيلي» · أ. شيخه المطيري</p>

  <div id="login">
    <p>سجّلي دخولك بحساب المعلمة (نفس حساب «مختبر المركبات الأيونية»):</p>
    <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button id="go">دخول</button> <span id="lerr" class="err"></span>
  </div>

  <div id="view" style="display:none">
    <div class="tools">
      <button id="ref" class="ghost">تحديث</button>
      <button id="pr" class="ghost">طباعة</button>
      <button id="csv" class="ghost">تنزيل Excel (CSV)</button>
      <label><input type="checkbox" id="zero" style="width:auto"> إظهار من ليس لديها شهادات</label>
      <button id="out" class="ghost">خروج</button>
    </div>
    <div class="stats" id="stats"></div>
    <table><thead><tr><th>#</th><th>اسم الطالبة</th><th>عدد شهادات التميّز</th><th>التفاصيل</th></tr></thead><tbody id="rows"></tbody></table>
    <p id="msg" class="sub"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyBq067CBAa0tLJxNMf60nObygvnRTgYwlI",authDomain:"chem-lab-shaikha.firebaseapp.com",projectId:"chem-lab-shaikha",storageBucket:"chem-lab-shaikha.firebasestorage.app",messagingSenderId:"305599144472",appId:"1:305599144472:web:ae27c01b81b925c238d96d"});
const auth=firebase.auth(), db=firebase.firestore(), $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة\b/g,'ه').replace(/ى\b/g,'ي');
let ROWS=[];

$('#go').onclick=()=>{ $('#lerr').textContent=''; auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>$('#lerr').textContent='تعذّر الدخول: تأكدي من البريد وكلمة المرور'); };
$('#pw').onkeydown=e=>{ if(e.key==='Enter') $('#go').click(); };
$('#out').onclick=()=>auth.signOut();
$('#ref').onclick=load; $('#pr').onclick=()=>print(); $('#zero').onchange=draw;
auth.onAuthStateChanged(u=>{ $('#login').style.display=u?'none':''; $('#view').style.display=u?'':'none'; if(u) load(); });

async function load(){
  $('#msg').textContent='جارٍ التحميل…';
  try{
    const snap=await db.collection('tahsili_others').get(), m={};
    snap.forEach(d=>{ const v=d.data(), k=norm(v.name); if(!k) return;
      const r=m[k]||(m[k]={name:String(v.name).trim(),total:0,by:[],ts:0});
      r.total+=v.certs||0; r.ts=Math.max(r.ts,v.ts||0);
      if(v.certs) r.by.push({course:v.course,n:v.certs,list:v.list||[]}); });
    ROWS=Object.values(m).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name,'ar'));
    $('#msg').textContent=''; draw();
  }catch(e){ $('#msg').innerHTML='<span class="err">تعذّر قراءة البيانات. تأكدي من نشر قاعدة <b>tahsili_others</b> في Firebase.</span>'; }
}
function draw(){
  const show=$('#zero').checked?ROWS:ROWS.filter(r=>r.total>0);
  const withC=ROWS.filter(r=>r.total>0);
  $('#stats').innerHTML=`<div class="stat"><b>${ROWS.length}</b>طالبة دخلت التحدي</div><div class="stat"><b>${withC.length}</b>طالبة لديها شهادة</div><div class="stat"><b>${withC.reduce((s,r)=>s+r.total,0)}</b>مجموع الشهادات</div>`;
  $('#rows').innerHTML=show.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td class="n">${r.total}</td><td>${r.by.map(b=>`<b>${esc(b.course)}:</b> ${b.n}<br><small>${b.list.map(esc).join('، ')}</small>`).join('<br>')||'—'}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center">لا توجد بيانات بعد</td></tr>';
}
$('#csv').onclick=()=>{
  const rows=[['اسم الطالبة','عدد شهادات التميز','التفاصيل'],...ROWS.filter(r=>$('#zero').checked||r.total>0).map(r=>[r.name,r.total,r.by.map(b=>b.course+': '+b.n).join(' | ')])];
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='شهادات_التميز_الفصول_الأخرى.csv'; a.click();
};
</script>
</body>
</html>
