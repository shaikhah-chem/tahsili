<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>كتيبات تحدّي التحصيلي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: petrol header, four booklet cards, then a page-by-page reader for the chosen booklet */
:root{--petrol:#0B4F6C;--coral:#F4845F;--turq:#3AAFA9;--bg:#F3F7F9;--surface:#FFFFFF;--ink:#16303B;--muted:#5B6C75;--line:#D6E2E8;--chip:#E8F3F6;--head:#0B4F6C;
--display:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;--body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C1A20;--surface:#13262E;--ink:#E6F1F5;--muted:#9BB1BA;--line:#24414C;--chip:#183641;--head:#082F40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1A20;--surface:#13262E;--ink:#E6F1F5;--muted:#9BB1BA;--line:#24414C;--chip:#183641;--head:#082F40;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:#fff;padding-block:22px 24px;border-bottom:5px solid var(--coral)}
h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:4px 0 0;opacity:.9}
.teacher{color:#9EE3DE;font-weight:700}
main{padding-block:22px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{font:inherit;color:inherit;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-width:0}
.card[aria-pressed="true"]{border-color:var(--coral)}
.card:focus-visible,.btn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.num{flex:none;width:52px;height:52px;border-radius:12px;background:var(--petrol);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.card b{display:block;font-family:var(--display);font-size:19px}
.card small{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 12px}
.bar h2{font-family:var(--display);margin:0;font-size:24px;color:var(--petrol)}
:root[data-theme="dark"] .bar h2{color:#7FD3CE}
.btn{text-decoration:none;display:inline-block;font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--coral);color:#fff}
.pages{display:flex;flex-direction:column;gap:14px;align-items:center}
.pages img{width:100%;max-width:820px;height:auto;aspect-ratio:210/297;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.note{color:var(--muted);font-size:15px}
</style>
<header><div class="wrap"><h1>كتيبات «تحدّي التحصيلي»</h1><p>تدريبات بنمط اختبار التحصيلي لمقررات الكيمياء · <span class="teacher">إعداد المعلمة: أ. شيخه المطيري</span></p></div></header>
<main class="wrap">
  <div class="grid" id="cards"></div>
  <div class="bar"><h2 id="ttl"></h2><span><span class="note" id="cnt"></span> <a class="btn" id="dl" download>تحميل الكتيب PDF</a></span></div>
  <div class="pages" id="pages"></div>
</main>
<script>
const B=[{k:'c1',n:'1',p:25,t:'الكيمياء 1',q:119},{k:'c21',n:'2-1',p:54,t:'الكيمياء 2-1',q:270},{k:'c22',n:'2-2',p:43,t:'الكيمياء 2-2',q:217},{k:'c3',n:'3',p:30,t:'الكيمياء 3',q:161}];
const $=s=>document.querySelector(s);
let cur=null, dl=null;
$('#cards').innerHTML=B.map(b=>`<button class="card" data-k="${b.k}" aria-pressed="false"><span class="num"><bdi dir="ltr">${b.n}</bdi></span><span><b>كيمياء <bdi dir="ltr">${b.n}</bdi></b><small>${b.q} سؤالًا · ${b.p} صفحة</small></span></button>`).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{show(c.dataset.k);});
function show(k){
  cur=B.find(b=>b.k===k)||B[0];
  document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===cur.k));
  $('#ttl').textContent='كتيب '+cur.t; $('#cnt').textContent=cur.p+' صفحة';
  const pad=n=>String(n).padStart(2,'0');
  $('#pages').innerHTML=Array.from({length:cur.p},(_,i)=>`<img loading="${i<2?'eager':'lazy'}" src="b/${cur.k}/p-${pad(i+1)}.jpg" alt="صفحة ${i+1} من كتيب ${cur.t}">`).join('');
  $('#dl').href='b/'+cur.k+'.pdf'; $('#dl').setAttribute('download','تدريبات تحصيلية - '+cur.t+'.pdf');
  try{history.replaceState(null,'','#'+cur.k)}catch(e){}
}
show((location.hash||'').slice(1));
</script>

</body></html>
