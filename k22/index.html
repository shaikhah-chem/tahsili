<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>تحدّي التحصيلي – كيمياء 2-2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: petrol lab-bench header, chapter cards grid, one focused question card per screen */
:root{
  --petrol:#0B4F6C; --coral:#F4845F; --turq:#3AAFA9;
  --bg:#F3F7F9; --surface:#FFFFFF; --ink:#16303B; --muted:#5B6C75; --line:#D6E2E8;
  --ok:#2E9E5B; --okbg:#E3F5EA; --bad:#D24B45; --badbg:#FBE7E5; --chip:#E8F3F6;
  --head:#0B4F6C; --headInk:#FFFFFF;
  --display:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1A20; --surface:#13262E; --ink:#E6F1F5; --muted:#9BB1BA; --line:#24414C;
  --okbg:#173A28; --badbg:#3E1D1B; --chip:#183641; --head:#082F40; --headInk:#F2FAFC; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1A20; --surface:#13262E; --ink:#E6F1F5; --muted:#9BB1BA; --line:#24414C;
  --okbg:#173A28; --badbg:#3E1D1B; --chip:#183641; --head:#082F40; --headInk:#F2FAFC; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;direction:rtl;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.namein{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--head);color:var(--headInk);padding-block:22px 26px;border-bottom:5px solid var(--coral)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.2;margin:0;text-wrap:balance}
.eyebrow{display:inline-block;background:var(--turq);color:#fff;border-radius:999px;padding:0 12px;font-size:14px;font-weight:700;margin-bottom:4px}
.brand p{margin:2px 0 0;opacity:.85;font-size:15px}
.teacher{font-weight:700;color:#9EE3DE}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{font:inherit;font-size:14px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:var(--headInk);border-radius:999px;padding:4px 14px;cursor:pointer}
.tg.other{background:var(--coral);border-color:var(--coral);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.tg[aria-pressed="true"]{background:var(--turq);border-color:var(--turq)}
.tg:focus-visible,.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.chipbtn:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
main{padding-block:24px 48px}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:22px}
.hero h2{font-family:var(--display);font-size:26px;margin:0;color:var(--petrol)}
:root[data-theme="dark"] .hero h2{color:#7FD3CE}
.hero p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:15px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:22px;color:var(--ink)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--coral);color:#fff;font-size:17px;box-shadow:0 4px 0 #C9623F;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C9623F}
.btn.alt{background:var(--turq);box-shadow:0 4px 0 #26807B}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--petrol);color:#fff;font-family:var(--display);font-size:22px;flex:none}
.card .hd{display:flex;gap:12px;align-items:center}
.card h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.35;text-wrap:balance}
.card .meta{font-size:14px;color:var(--muted)}
.best{font-size:13px;color:var(--turq);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:inherit;font-size:13.5px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}
.chipbtn:hover{border-color:var(--turq)}
.card .go{align-self:flex-start;padding:8px 18px;font-size:15px}
/* quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.progress{flex:1 1 200px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--turq),var(--coral));transition:width .3s}
.pill{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}
.pill b{font-family:var(--display)}
.timer{font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.tag{color:#fff;border-radius:6px;padding:0 9px;font-weight:700;font-size:13px}
.tag.T{background:var(--coral)} .tag.D{background:var(--turq)}
.qtext{font-size:clamp(19px,2.6vw,23px);font-weight:700;line-height:1.6;margin:4px 0 8px}
.eq{direction:ltr;text-align:center;font-weight:700;color:var(--coral);font-size:20px;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:620px){.opts{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
.opt{font:inherit;text-align:right;display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:17.5px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--turq)}
.opt .L{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--turq);color:#fff;font-weight:700;font-family:Arial,sans-serif}
.opt.ok{background:var(--okbg);border-color:var(--ok)} .opt.ok .L{background:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)} .opt.bad .L{background:var(--bad)}
.opt:disabled{cursor:default}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb.good{background:var(--okbg);border:1.5px solid var(--ok)}
.fb.miss{background:var(--badbg);border:1.5px solid var(--bad)}
.fb .msg{font-family:var(--display);font-size:21px}
.fb .ex{margin-top:2px}
.fb .note{font-size:13.5px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
sub,sup{font-size:.7em;line-height:0}
bdi{unicode-bidi:isolate}
/* results */
.res{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.res h2{font-family:var(--display);font-size:34px;margin:0;color:var(--petrol)}
:root[data-theme="dark"] .res h2{color:#7FD3CE}
.stars{font-size:46px;letter-spacing:6px;color:var(--line)} .stars .on{color:#F5B83D}
.big{font-family:var(--display);font-size:52px;line-height:1.1}
.review{text-align:right;margin-top:18px;display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.rv .a{color:var(--ok);font-weight:700}
.rv .y{color:var(--bad);font-weight:700}
footer{color:var(--muted);font-size:14px;text-align:center;padding-block:10px 30px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--petrol);color:#fff;padding:8px 18px;border-radius:999px;font-family:var(--display);font-size:20px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

/* ---- motivation */
.me{display:grid;grid-template-columns:auto 1fr auto;gap:14px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:16px}
@media (max-width:620px){.me{grid-template-columns:auto 1fr}.me .acts{grid-column:1/-1}}
.lvl{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--coral) calc(var(--p)*1%),var(--line) 0);position:relative}
.lvl span{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--petrol)}
:root[data-theme="dark"] .lvl span{color:#7FD3CE}
.me h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.3}
.me .sub{color:var(--muted);font-size:14.5px}
.me .nums{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px;font-size:14.5px;color:var(--muted)}
.me .nums b{font-family:var(--display);font-size:19px;color:var(--ink)}
.me .acts{display:flex;gap:8px;flex-wrap:wrap}
.me .acts .btn{padding:8px 16px;font-size:15px}
.namein{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:4px 10px;width:min(220px,100%)}
.nudge{background:var(--chip);border:1px dashed var(--turq);border-radius:14px;padding:10px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nudge .btn{padding:7px 16px;font-size:15px}
.st{color:#F5B83D;letter-spacing:1px;font-size:12px;margin-inline-start:2px}
.st .off{color:var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bdg svg{width:52px;height:52px}
.bdg b{font-family:var(--display);font-size:17px}
.bdg small{color:var(--muted);font-size:13px;line-height:1.5}
.bdg.locked{opacity:.45;filter:grayscale(1)}
.cert{max-width:760px;margin:0 auto;background:#FFFDF8;color:#16303B;border:10px double #0B4F6C;border-radius:8px;padding:34px 28px;text-align:center;position:relative}
.cert:before{content:"";position:absolute;inset:8px;border:1.5px solid #F4845F;border-radius:4px;pointer-events:none}
.cert .k{font-size:15px;color:#3AAFA9;font-weight:700;letter-spacing:.5px}
.cert h2{font-family:var(--display);font-size:clamp(30px,6vw,44px);color:#0B4F6C;margin:6px 0}
.cert .who{font-family:var(--display);font-size:clamp(26px,5vw,36px);color:#C9623F;border-bottom:2px dotted #3AAFA9;display:inline-block;padding:0 18px;margin:6px 0 10px}
.cert p{margin:6px 0;font-size:17px}
.cert .sig{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:15px;flex-wrap:wrap}
.hint{color:var(--muted);text-align:center;font-size:14.5px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.opt.shake{animation:none}.progress i{transition:none}}
</style>

<header class="top" dir="rtl"><div class="wrap">

// ---------- text rendering (sub/sup + bidi isolation)
const LTR = /[A-Za-z0-9δλνΔ\[(][A-Za-z0-9δλνΔ _^{}()+\-−–×÷=.,/%°→\[\]:·≈]*[A-Za-z0-9)}%°\]+\-−]|[A-Za-z0-9δλνΔ]/g;
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk = s => esc(s).replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>');
function R(s){ if(!/[؀-ۿ]/.test(s)) return '<bdi dir="ltr">'+mk(s)+'</bdi>';
  let out='',i=0,m; LTR.lastIndex=0;
  while((m=LTR.exec(s))){ out+=mk(s.slice(i,m.index))+'<bdi dir="ltr">'+mk(m[0])+'</bdi>'; i=LTR.lastIndex; }
  return out+mk(s.slice(i)); }

// ---------- audio
let AC=null; function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f,d,type='sine',vol=.18,when=0){ if(!S.sound)return; const a=ac(); if(!a)return; const t=a.currentTime+when;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02); }
function noise(d=.6,vol=.08,when=0){ if(!S.sound)return; const a=ac(); if(!a)return; const t=a.currentTime+when;
  const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate), ch=b.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; f.Q.value=.6;
  const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f).connect(g).connect(a.destination); s.start(t); }
const sfx = {

  fanfare(){[[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64]].forEach(([f,w])=>beep(f,.22,'square',.09,w)); noise(1,.09,.4);},
  win(){[392,523,659,784,659,784,1047].forEach((f,i)=>beep(f,.25,'triangle',.15,i*.15)); noise(1.2,.08,.9);},
  tick(){beep(1200,.04,'square',.05);} };

// ---------- confetti
const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight} addEventListener('resize',fit); fit();
function confetti(n=90){ if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#F4845F','#3AAFA9','#0B4F6C','#F5B83D','#FFFFFF'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:120});
  if(!raf) loop(); }
function loop(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  raf=parts.length?requestAnimationFrame(loop):0; if(!raf)cx.clearRect(0,0,cv.width,cv.height); }
function toast(t){const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600);}

const ALL = DATA.chapters.flatMap(c=>c.lessons.flatMap(l=>l.qs.map(q=>({...q,lesson:l,chapter:c}))));
const EXTRA = (function(e,k){if(!e)return [];try{const b=atob(e),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i)^k.charCodeAt(i%k.length);return JSON.parse(new TextDecoder().decode(u));}catch(x){return [];}})("","FDByZjgXsvoVOYkSCyzRhwsS");
const FULL = ALL.map(q=>({...q,course:'2-2'})).concat(EXTRA.flatMap(d=>d.chapters.flatMap(c=>c.lessons.flatMap(l=>l.qs.map(q=>({...q,lesson:l,chapter:c,course:d.meta.course.replace('الكيمياء ','')})))))); 
const selGet=()=>{let v=store.get('sel',null); if(!Array.isArray(v)||!v.length) v=[DATA.chapters[0].num]; return v.filter(n=>DATA.chapters.some(c=>c.num==n)).sort((a,b)=>a-b)};
const selName=(v)=>v.length===DATA.chapters.length?'التحدي الشامل للمقرر':'تحدّي الفصول '+v.join('، ');
const isCertKey=k=>k&&(k[0]==='u'||k[0]==='c'||k[0]==='l'||k==='full');
const keyName=k=>k==='full'?'التحدي الكامل لمقررات الكيمياء':k[0]==='u'?selName(k.slice(1).split('-').map(Number)):'';
const shuffle = a => {a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
const PRAISE=['أحسنتِ!','رائعة!','ممتاز!','إجابة موفقة!','عبقرية كيمياء!','استمري هكذا!'];

const pick = a => a[Math.floor(Math.random()*a.length)];

const LESSONS=DATA.chapters.flatMap(c=>c.lessons);
function prof(){return Object.assign({name:'',xp:0,day:'',days:0,badges:[]},store.get('prof',{}))}
function saveProf(p){store.set('prof',p)}
function level(xp){let i=0;LEVELS.forEach((l,j)=>{if(xp>=l.x)i=j});const nx=LEVELS[i+1];return{i,n:LEVELS[i].n,next:nx,pct:nx?Math.round((xp-LEVELS[i].x)/(nx.x-LEVELS[i].x)*100):100}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function touchDay(p){const t=today(); if(p.day===t)return; const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); p.days=(p.day===ys)?p.days+1:1; p.day=t;}
function stars(pct){return pct==null?0:pct>=90?3:pct>=70?2:pct>=50?1:0}
function starHtml(pct){const n=stars(pct);return `<span class="st" aria-label="${n} نجوم">${[0,1,2].map(i=>i<n?'★':'<span class="off">★</span>').join('')}</span>`}
function doneLessons(){const b=store.get('best',{});return LESSONS.filter(l=>b['l'+l.code]!=null).length}
function award(p,id){ if(p.badges.includes(id))return false; p.badges.push(id); const b=BADGES.find(x=>x.id===id);
  if(Q)Q.newB.push(b); toast('إنجاز جديد: '+b.t); sfx.fanfare(); confetti(160); say('إنجاز جديد! '+b.t); return true;}
function checkBadges(p,ctx={}){
  if(p.xp>=1)award(p,'first'); if(ctx.streak>=5)award(p,'s5'); if(ctx.streak>=10)award(p,'s10');
  const b=store.get('best',{}); if(LESSONS.some(l=>(b['l'+l.code]||0)>=90))award(p,'l3');
  const dn=doneLessons(); if(dn>=10)award(p,'l10'); if(dn>=LESSONS.length)award(p,'lall');
  if(DATA.chapters.some(c=>(b['c'+c.num]||0)>=70))award(p,'ch'); if(Object.keys(b).some(k=>(k[0]==='u'||k==='full')&&b[k]>=90))award(p,'all90');
  if(p.days>=3)award(p,'d3'); if(p.days>=7)award(p,'d7'); if(level(p.xp).i===LEVELS.length-1)award(p,'hero');
  saveProf(p);}

}

// ---------- quiz
let Q=null, timerId=0;
function stopTimer(){clearInterval(timerId);timerId=0}
function start(list,title,key){ ac(); Q={list,title,key,i:0,score:0,streak:0,best:0,wrong:[],newB:[],xp0:prof().xp}; show(); }
function show(){
  stopTimer();
  const q=Q.list[Q.i], n=Q.list.length;
  const ord=['A','B','C','D'];
  app.innerHTML = `
  <div class="qbar"><button class="btn ghost" id="quit" style="padding:6px 14px;font-size:15px">الرئيسية</button>
    <div class="progress" aria-hidden="true"><i style="width:${Q.i/n*100}%"></i></div>
    <span class="pill">سؤال <b>${Q.i+1}</b> من ${n}</span><span class="pill">النقاط <b>${Q.score}</b></span>
    <span class="pill">سلسلة <b>${Q.streak}</b></span>${S.timer?'<span class="pill timer" id="tm">30</span>':''}</div>
  <article class="qcard">
    <div class="qmeta"><span class="tag ${q.src}">${q.src==='T'?'تحصيلي':'تدريب'}</span><span>${R(Q.title)}</span>
      <span>· ${q.course&&Q.key==='full'?`كيمياء <bdi dir="ltr">${q.course}</bdi> · `:''}الدرس <bdi dir="ltr">${q.lesson.code}</bdi> · كتاب الطالب ص ${q.lesson.page}</span></div>
    <div class="qtext">${R(q.q)}</div>
    ${q.eq?`<div class="eq">${mk(q.eq)}</div>`:''}
    <div class="opts">${ord.map((L,i)=>`<button class="opt" data-k="${L}"><span class="L">${L}</span><span>${R(q.o[i])}</span></button>`).join('')}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="nav"><span></span><button class="btn" id="next" hidden>${Q.i+1<n?'السؤال التالي':'عرض النتيجة'}</button></div>
  </article>`;
  $('#quit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.k));
  $('#next').onclick=()=>{Q.i++; Q.i<Q.list.length?show():results()};
  if(S.timer){let t=30; timerId=setInterval(()=>{t--; const el=$('#tm'); if(!el){stopTimer();return} el.textContent=t; if(t<=5){el.classList.add('low');sfx.tick()} if(t<=0){stopTimer();answer(null)}},1000)}
}
function answer(k){
  stopTimer();
  const q=Q.list[Q.i], ok=k===q.a;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.dataset.k===q.a)b.classList.add('ok'); if(b.dataset.k===k&&!ok){b.classList.add('bad','shake')}});
  const fb=$('#fb');
  const P=prof(); touchDay(P); if(ok)P.xp++; saveProf(P);
  if(ok){Q.score++;Q.streak++;Q.best=Math.max(Q.best,Q.streak); const p=pick(PRAISE);
    fb.className='fb show good'; fb.innerHTML=`<div class="msg">${p}</div><div class="ex"><b>التفسير:</b> ${R(q.ex)}</div>`;
    if([3,5,10].includes(Q.streak)){sfx.fanfare();confetti(140);toast(`سلسلة ${Q.streak} إجابات صحيحة!`);say('رائع! '+Q.streak+' إجابات صحيحة متتالية')} else {sfx.ok();confetti(50);say(p)}
  } else { Q.streak=0; Q.wrong.push({q,k});
    fb.className='fb show miss'; fb.innerHTML=`<div class="msg">${k?pick(ENC):'انتهى الوقت'}</div><div class="ex">الإجابة الصحيحة: <b>${q.a}</b>. <b>التفسير:</b> ${R(q.ex)}</div>${q.note?`<div class="note">ملاحظة: ${R(q.note)}</div>`:''}`;
    sfx.bad(); }
  setTimeout(()=>checkBadges(prof(),{streak:Q.streak}),700);
  $('#next').hidden=false; $('#next').focus({preventScroll:true});
}
function results(){
  const n=Q.list.length, pct=Math.round(Q.score/n*100), stars=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const best=store.get('best',{}); const isBest=best[Q.key]==null||pct>best[Q.key]; if(isBest){best[Q.key]=pct;store.set('best',best)}
  if(stars>=2){sfx.win();confetti(220)} else sfx.ok();
  const P=prof(); const lv0=level(Q.xp0).i; checkBadges(P,{}); const lv=level(P.xp);
  say(stars===3?'أداء رائع! أنتِ نجمة التحصيلي':stars>=1?'أحسنتِ، استمري في التدريب':'لا بأس، راجعي الأخطاء وحاولي مجددًا');
  app.innerHTML=`<section class="res">
    <h2>${stars===3?'أداء مذهل!':stars===2?'أحسنتِ!':stars===1?'بداية جيدة':'لنراجع معًا'}</h2>
    <div class="stars" aria-label="${stars} من 3 نجوم">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}">★</span>`).join('')}</div>
    <div class="big"><bdi dir="ltr">${Q.score}/${n}</bdi></div>
    <p>النسبة <b>${pct}%</b> · أطول سلسلة صحيحة <b>${Q.best}</b>${isBest?' · أفضل نتيجة جديدة!':''}</p>
    <p>+${P.xp-Q.xp0} إجابة صحيحة لرصيدك · مستواك: <b>${lv.n}</b>${lv.i>lv0?' · ارتقيتِ مستوى جديدًا!':''}</p>
    ${Q.newB.length?`<div class="badges" style="max-width:640px;margin:10px auto">${Q.newB.map(x=>`<div class="bdg">${svg(x.i)}<b>${x.t}</b><small>${x.d}</small></div>`).join('')}</div>`:''}
    <div class="nav" style="justify-content:center"><button class="btn" id="again">أعيدي المحاولة</button><button class="btn alt" id="hm">الرئيسية</button><a class="btn ghost" href="https://docs.google.com/forms/d/e/1FAIpQLSdiPcZ14fewwkFP0jjGAs7y324ZiHgcVNTM-4jnGFAqijRnqg/viewform" target="_blank" rel="noopener" style="text-decoration:none">شاركينا رأيك بدقيقة</a>${stars===3&&isCertKey(Q.key)?'<button class="btn" id="getCert" style="background:#F5B83D;box-shadow:0 4px 0 #C9923D;color:#16303B">اعرضي شهادتك</button>':''}</div>
    ${Q.wrong.length?`<div class="review"><h3 style="margin:8px 0 0;font-family:var(--display)">راجعي أخطاءك (${Q.wrong.length})</h3>${Q.wrong.map(({q,k})=>`<div class="rv">
      <div><b>${q.n}.</b> ${R(q.q)}</div>${q.eq?`<div class="eq" style="font-size:17px">${mk(q.eq)}</div>`:''}
      <div>${k?`إجابتك: <span class="y">${k}) ${R(q.o['ABCD'.indexOf(k)])}</span> · `:'لم تُجيبي · '}الصحيحة: <span class="a">${q.a}) ${R(q.o['ABCD'.indexOf(q.a)])}</span></div>
      <div class="note" style="color:var(--muted)">التفسير: ${R(q.ex)}</div></div>`).join('')}</div>`:''}
  </section>`;
  $('#again').onclick=()=>start(shuffle(Q.list),Q.title,Q.key); $('#hm').onclick=home;
  const gc=$('#getCert'); if(gc){const tt=Q.title; gc.onclick=()=>cert(`تحقيق ${pct}% في ${tt}`)}
  scrollTo({top:0});
}
home();
</script>
